name: Refresh verified visual baselines
on:
  push:
    branches: [verify/full-ci-324-327-328-337]
permissions:
  contents: write
jobs:
  refresh:
    if: "startsWith(github.event.head_commit.message, 'ci: refresh visual baselines')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual:update
      - name: Commit updated screenshot references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if ! git diff --cached --quiet; then
            git commit -m "test(visual): update baselines for accessibility changes"
            git push origin HEAD:verify/full-ci-324-327-328-337
          fi
